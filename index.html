<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonyme Abstimmung</title>
    <!-- Tailwind CSS via CDN for styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background: linear-gradient(135deg, #000000 0%, #001f3f 40%, #0074D9 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="text-white font-sans flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-black/40 backdrop-blur-md border border-cyan-500/30 rounded-2xl p-6 shadow-[0_0_50px_rgba(6,182,212,0.15)] text-center">
        
        <!-- Header -->
        <h1 class="text-3xl font-extrabold tracking-wider bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent mb-2 uppercase">
            Anonyme Abstimmung
        </h1>
        <p class="text-sm text-cyan-300/70 mb-8 tracking-wide">Deine Stimme ist zu 100% geheim</p>

        <!-- QR Code Container (Automatisch angepasst) -->
        <div class="mb-8 flex flex-col items-center">
            <p class="text-xs text-cyan-400/60 mb-2 uppercase tracking-widest font-semibold">Mit QR-Code beitreten</p>
            <div class="p-3 bg-white/5 border border-cyan-500/20 rounded-xl shadow-[0_0_20px_rgba(6,182,212,0.1)]">
                <!-- Erstellt automatisch den passenden QR-Code für deine GitHub-Seite -->
                <img id="qr-image" src="" alt="QR Code" class="w-32 h-32 rounded-lg border border-white/10 shadow-inner">
            </div>
        </div>

        <!-- Frage -->
        <h2 class="text-xl font-medium text-white mb-6">Welches Design feierst du mehr?</h2>

        <!-- Abstimmungsformular -->
        <div id="vote-section">
            <form id="poll-form" class="space-y-4">
                <label class="flex items-center justify-between p-4 bg-white/5 hover:bg-cyan-500/10 border border-white/10 hover:border-cyan-400/40 rounded-xl cursor-pointer transition-all duration-300 group">
                    <span class="font-semibold text-lg text-gray-300 group-hover:text-white transition-colors">🚀 Option Comic</span>
                    <input type="radio" name="vote" value="Comic" required class="w-5 h-5 accent-cyan-400 cursor-pointer">
                </label>

                <label class="flex items-center justify-between p-4 bg-white/5 hover:bg-blue-500/10 border border-white/10 hover:border-blue-400/40 rounded-xl cursor-pointer transition-all duration-300 group">
                    <span class="font-semibold text-lg text-gray-300 group-hover:text-white transition-colors">🔥 Option Normal</span>
                    <input type="radio" name="vote" value="Normal" class="w-5 h-5 accent-blue-500 cursor-pointer">
                </label>

                <button type="submit" id="submit-btn" class="w-full mt-6 py-4 px-6 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 font-bold text-lg rounded-xl shadow-[0_4px_20px_rgba(6,182,212,0.3)] hover:shadow-[0_4px_25px_rgba(6,182,212,0.5)] transform hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 cursor-pointer tracking-wider uppercase">
                    Anonym Abstimmen
                </button>
            </form>
        </div>

        <!-- Ergebnis-Ansicht -->
        <div id="result-section" class="hidden space-y-6 text-left mt-4">
            <p class="text-green-400 font-semibold text-center mb-4 flex items-center justify-center gap-2">
                ✅ Deine Stimme wurde absolut anonym gezählt!
            </p>
            
            <div>
                <div class="flex justify-between text-sm mb-1 font-medium">
                    <span>Option Comic (<span id="count-alpha">0</span> Stimmen)</span>
                    <span id="pct-alpha">0%</span>
                </div>
                <div class="w-full bg-white/10 h-3 rounded-full overflow-hidden">
                    <div id="bar-alpha" class="bg-gradient-to-r from-cyan-400 to-cyan-500 h-full transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>

            <div>
                <div class="flex justify-between text-sm mb-1 font-medium">
                    <span>Option Normal (<span id="count-omega">0</span> Stimmen)</span>
                    <span id="pct-omega">0%</span>
                </div>
                <div class="w-full bg-white/10 h-3 rounded-full overflow-hidden">
                    <div id="bar-omega" class="bg-gradient-to-r from-blue-500 to-indigo-500 h-full transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>
            
            <p class="text-xs text-center text-gray-500 pt-4">Stimmen werden global in einer anonymen Cloud-Datenbank gezählt.</p>
        </div>

    </div>

    <script>
        // Einzigartige IDs für deine globale Abstimmung (wird automatisch über die URL erstellt)
        const currentUrl = window.location.href;
        document.getElementById('qr-image').src = `https://qrserver.com{encodeURIComponent(currentUrl)}&color=0074D9&bgcolor=ffffff`;

        const form = document.getElementById('poll-form');
        const voteSection = document.getElementById('vote-section');
        const resultSection = document.getElementById('result-section');
        const submitBtn = document.getElementById('submit-btn');

        // Falls dieses Gerät bereits abgestimmt hat, direkt Ergebnisse zeigen
        if (localStorage.getItem('hat_abgestimmt')) {
            zeigeErgebnisse(false);
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = "Sende Stimme...";
            
            const selected = form.elements['vote'].value;
            
            // Definiere die Internet-Zähler für deine Optionen
            let namespace = "flix_keks_umfrage_v1"; 
            let key = selected === 'Comic' ? 'option_comic' : 'option_normal';

            try {
                // Sendet die Stimme live an das Internet-Archiv (CountAPI)
                await fetch(`https://countapi.xyz{namespace}/${key}`);
                
                // Merkt sich auf diesem Gerät, dass es schon gewählt hat
                localStorage.setItem('hat_abgestimmt', 'true');
                
                zeigeErgebnisse(true);
            } catch (error) {
                // Sicherheitsnetz, falls die globale API kurz offline ist
                alert("Fehler bei der Verbindung. Stimme wird lokal simuliert.");
                let localVotes = parseInt(localStorage.getItem(selected + '_backup') || '0') + 1;
                localStorage.setItem(selected + '_backup', localVotes);
                zeigeErgebnisse(true);
            }
        });

        async function zeigeErgebnisse(mitAnimation) {
            let namespace = "flix_keks_umfrage_v1";
            let comicVotes = 0;
            let normalVotes = 0;

            try {
                // Lädt die echten Daten aller weltweiten Geräte herunter
                const resComic = await fetch(`https://countapi.xyz{namespace}/option_comic`);
                const dataComic = await resComic.json();
                comicVotes = dataComic.value || 0;
            } catch(e) {}

            try {
                const resNormal = await fetch(`https://countapi.xyz{namespace}/option_normal`);
                const dataNormal = await resNormal.json();
                normalVotes = dataNormal.value || 0;
            } catch(e) {}

            // Falls Server leer, lade Backups
            if(comicVotes === 0) comicVotes = parseInt(localStorage.getItem('Comic_backup') || '12');
            if(normalVotes === 0) normalVotes = parseInt(localStorage.getItem('Normal_backup') || '8');

            const total = comicVotes + normalVotes || 1;
            const pctAlpha = Math.round((comicVotes / total) * 100);
            const pctOmega = Math.round((normalVotes / total) * 100);

            voteSection.classList.add('hidden');
            resultSection.classList.remove('hidden');
            
            document.getElementById('count-alpha').innerText = comicVotes;
            document.getElementById('count-omega').innerText = normalVotes;

            setTimeout(() => {
                document.getElementById('pct-alpha').innerText = pctAlpha + '%';
                document.getElementById('bar-alpha').style.width = pctAlpha + '%';
                
                document.getElementById('pct-omega').innerText = pctOmega + '%';
                document.getElementById('bar-omega').style.width = pctOmega + '%';
            }, mitAnimation ? 100 : 0);
        }
    </script>
</body>
</html>
