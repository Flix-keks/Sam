<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direkter Vergleich & Auswertung</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            color: #0f172a;
        }

        p.subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .col {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        input {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #f1f5f9;
            border-radius: 8px;
            border-left: 5px solid var(--primary);
            display: none; /* Wird erst nach Klick sichtbar */
        }

        .result-box h3 {
            margin-top: 0;
            color: #0f172a;
        }

        #evaluationText {
            line-height: 1.5;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Schnell-Auswertung</h1>
    <p class="subtitle">Geben Sie für beide Optionen einen Wert (Zahl) ein, um die Auswertung zu starten.</p>
    
    <div class="input-group">
        <div class="col">
            <label for="val1">Option A (z.B. Produkt 1 Preis)</label>
            <input type="number" id="val1" placeholder="Wert eingeben...">
        </div>
        <div class="col">
            <label for="val2">Option B (z.B. Produkt 2 Preis)</label>
            <input type="number" id="val2" placeholder="Wert eingeben...">
        </div>
    </div>

    <button onclick="berechneAuswertung()">Auswertung generieren</button>

    <div class="result-box" id="resultBox">
        <h3>Ergebnis der Analyse:</h3>
        <p id="evaluationText"></p>
    </div>
</div>

<script>
function berechneAuswertung() {
    // Werte aus den Input-Feldern auslesen
    const wert1 = parseFloat(document.getElementById('val1').value);
    const wert2 = parseFloat(document.getElementById('val2').value);
    const resultBox = document.getElementById('resultBox');
    const evaluationText = document.getElementById('evaluationText');

    // Validierung: Prüfen ob Zahlen eingegeben wurden
    if (isNaN(wert1) || !isNaN(wert1) && isNaN(wert2)) {
        alert("Bitte geben Sie in beide Felder eine gültige Zahl ein.");
        return;
    }

    // Berechnung
    let text = "";
    if (wert1 > wert2) {
        const unterschied = wert1 - wert2;
        text = `<strong>Option A</strong> ist um <strong>${unterschied}</strong> größer als Option B.<br><br>➔ Wenn es sich um Kosten handelt, ist Option B die günstigere Wahl. Wenn es um Leistung oder Punkte geht, liegt Option A vorne.`;
    } else if (wert2 > wert1) {
        const unterschied = wert2 - wert1;
        text = `<strong>Option B</strong> ist um <strong>${unterschied}</strong> größer als Option A.<br><br>➔ Wenn es sich um Kosten handelt, ist Option A die günstigere Wahl. Wenn es um Leistung oder Punkte geht, liegt Option B vorne.`;
    } else {
        text = `Beide Optionen sind mit einem Wert von <strong>${wert1}</strong> absolut **gleichwertig**. Es gibt keinen messbaren Unterschied.`;
    }

    // Ergebnis anzeigen
    evaluationText.innerHTML = text;
    resultBox.style.display = 'block';
}
</script>

</body>
</html>
